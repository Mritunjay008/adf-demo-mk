name: ADF Dev and QA POC

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev, qa]

permissions:
  contents: write

env:
  SUBSCRIPTION: 4d070b73-30f5-482d-9606-75f6f000330f
  RESOURCE_GROUP: rg-adf-poc
  DEV_FACTORY: adf-poc-dev-mk-001

jobs:
  validate-pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The default PR checkout is the proposed merge, not the feature head alone.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployment safeguards
        run: node --test scripts/adf.test.mjs
      - name: Export and validate proposed Dev artifacts without Azure login
        run: bash scripts/export-adf.sh

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/qa')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: adf-${{ github.ref_name }}-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deployment safeguards
        run: node --test scripts/adf.test.mjs
      - name: Export and prepare target artifacts
        id: export
        run: bash scripts/export-adf.sh
      - name: Sign in to Azure without a client secret
        if: steps.export.outputs.has-source == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Check existing linked services and integration runtimes
        if: steps.export.outputs.has-source == 'true'
        id: target
        run: node scripts/check-adf.mjs prepare
      # v2's shared deployment definition explicitly sets mode: "Incremental".
      - name: Validate target ARM template
        if: steps.target.outputs.has-resources == 'true'
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: validate
          scope: resourceGroup
          subscription-id: ${{ env.SUBSCRIPTION }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          template-file: build/adf/template.json
          parameters-file: build/adf/parameters.json
      - name: Create or update target artifacts (Incremental only)
        if: success() && steps.target.outputs.has-resources == 'true'
        uses: azure/bicep-deploy@v2
        with:
          type: deployment
          operation: create
          scope: resourceGroup
          name: adf-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          subscription-id: ${{ env.SUBSCRIPTION }}
          resource-group-name: ${{ env.RESOURCE_GROUP }}
          template-file: build/adf/template.json
          parameters-file: build/adf/parameters.json
      - name: Verify deployed target artifacts
        if: steps.target.outputs.has-resources == 'true'
        run: node scripts/check-adf.mjs verify
